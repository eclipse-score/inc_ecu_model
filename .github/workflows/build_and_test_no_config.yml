name: "Build & Test (Host)"

on:
  merge_group:
    types: [ checks_requested ]
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Prepare Bazel Environment
        uses: ./.github/actions/prepare_bazel_environment

      - name: Build all targets
        run: bazel build //...

      - name: Run all tests
        id: run-tests
        run: bazel test //... --build_tests_only

      - name: Upload failed Bazel test logs
        if: inputs.fetch-only != 'true' && failure() && steps.run-tests.outcome == 'failure'
        uses: ./.github/actions/upload_bazel_testlogs_on_failure
        with:
          artifact-name: bazel-testlogs-no-config

      - name: Build module_integration_test
        run: cd test && bazel build //... && bazel mod deps --lockfile_mode=update

  pycoverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required by actions/upload-code-coverage to publish results to Code Quality.
      code-quality: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # Check out the PR head commit (not the merge commit) so coverage line
          # numbers map onto the diff shown in the pull request.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare Bazel Environment
        uses: ./.github/actions/prepare_bazel_environment

      - name: Run tests with coverage
        # Coverage flags (instrumentation filter, combined lcov report) live in .bazelrc.
        run: bazel coverage //score/...

      - name: Generate HTML coverage report
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov
          genhtml bazel-out/_coverage/_coverage_report.dat --output-directory coverage-html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-html
          path: coverage-html
          if-no-files-found: error

      - name: Convert lcov report to Cobertura XML
        # GitHub Code Quality only ingests Cobertura, Bazel only emits lcov.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bazel run //tools/coverage:lcov_to_cobertura

      - name: Publish coverage to GitHub Code Quality
        # Fork PRs cannot write to Code Quality; their report remains available as an artifact.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/bazel

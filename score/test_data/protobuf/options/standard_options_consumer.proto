syntax = "proto3";

package integration.standard_options;

option java_package = "integration.standard_options.generated";
option optimize_for = LITE_RUNTIME;
option deprecated = true;

message StandardOptionMessage {
  option deprecated = true;

  string deprecated_value = 1 [deprecated = true];
  repeated int32 unpacked_values = 2 [packed = false];
}

enum StandardOptionState {
  option allow_alias = true;
  option deprecated = true;

  STANDARD_OPTION_STATE_UNSPECIFIED = 0 [deprecated = true];
  STANDARD_OPTION_STATE_UNKNOWN = 0;
}

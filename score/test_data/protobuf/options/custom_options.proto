syntax = "proto3";

package integration.deployment;

import "google/protobuf/descriptor.proto";

enum EnumSize {
  ES_32 = 0;
  ES_8 = 1;
  ES_16 = 2;
}

message FieldDeployment {
  string transport = 1;
  uint32 queue_depth = 2;
  repeated string description = 3;
  uint64 max_count = 4;
}

message ScopeDeployment {
  string scope = 1;
  repeated string description = 2;
  EnumSize size = 3;
}

extend google.protobuf.FileOptions {
  ScopeDeployment file_deployment = 50001;
}

extend google.protobuf.MessageOptions {
  ScopeDeployment message_deployment = 50002;
}

extend google.protobuf.FieldOptions {
  FieldDeployment field_deployment = 50003;
}

extend google.protobuf.EnumOptions {
  ScopeDeployment enum_deployment = 50004;
}

extend google.protobuf.EnumValueOptions {
  ScopeDeployment enum_value_deployment = 50005;
}

extend google.protobuf.OneofOptions {
  ScopeDeployment oneof_deployment = 50006;
}

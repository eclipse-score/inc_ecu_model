syntax = "proto3";

package integration.pipeline;

message NestedTypeContainer {
  message NestedPayload {
    string value = 1;
  }

  enum NestedState {
    NESTED_STATE_UNSPECIFIED = 0;
    NESTED_STATE_ACTIVE = 1;
  }
}

enum TopLevelState {
  TOP_LEVEL_STATE_UNSPECIFIED = 0;
  TOP_LEVEL_STATE_ACTIVE = 1;
}

message NestedTypeConsumer {
  NestedTypeContainer.NestedPayload payload = 1;
  NestedTypeContainer.NestedState state = 2;
  TopLevelState top_level_state = 3;
}

syntax = "proto3";

package integration.consumer;

import "shared.proto";

message Request {
  integration.shared.Payload payload = 1;
  repeated integration.shared.Payload payloads = 2;
  map<string, integration.shared.Payload> payloads_by_id = 3;

  oneof alternative_payload {
    integration.shared.Payload fallback_payload = 4;
  }
}

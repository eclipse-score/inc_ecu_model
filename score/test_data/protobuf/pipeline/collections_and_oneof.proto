syntax = "proto3";

package integration.pipeline.collections;

enum State {
  STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
}

message Child {
  uint32 id = 1;
}

message External {
  enum EntryState {
    ENTRY_STATE_UNSPECIFIED = 0;
    ENTRY_STATE_ACTIVE = 1;
  }

  message CountsEntry {
    uint32 id = 1;
  }
}

message Shape {
  optional string nickname = 1;
  map<string, Child> counts = 2;
  oneof identity {
    string email = 3;
    Child child = 4;
  }
  repeated Child children = 5;
  State state = 6;
  External.CountsEntry external_entry = 7;
}
